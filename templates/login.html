{% load static %}
<!DOCTYPE html>
<html lang="en" class="bg-background">

<head>
  <script>
    // Set theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var saved = localStorage.getItem('luxe-theme');
        var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b00">
    <title>Login | LUXE</title>
    <meta name="description"
        content="Sign in to your LUXE account and access your orders, wishlist and saved addresses.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .message {
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .message.error {
            background: rgba(49, 5, 5, 0.16);
            color: #cf0404;
            margin-top: 20px;
            border: 1px solid rgba(190, 0, 0, 0.25);
        }

        .message.success {
            background: rgba(39, 161, 23, 0.16);
            color: #5af199;
            margin-top: 20px;
            border: 1px solid rgba(48, 172, 58, 0.966);
        }
    </style>
</head>

<body data-page="login">
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
    <div id="site-header"></div>

    <main>
        <section class="auth-wrap">
            <div class="auth-card">
                <h1>Welcome back</h1>

                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                <p class="sub">Sign in to manage your orders, wishlist and saved preferences.</p>
                <form class="form-row" method="post">
                    {% csrf_token %}
                    <div class="form-field"><label for="login-email">Email address</label><input id="login-email"
                            type="email" placeholder="you@example.com"></div>
                    <div class="form-field"><label for="login-password">Password</label><input id="login-password"
                            type="password" placeholder="Enter your password"></div>
                    <div class="form-aux"><a href="forgot-password.html">Forgot password?</a></div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
                </form>
                <div class="auth-foot">Don’t have an account? <a href="/signup">Create one</a></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="{% static 'js/main.js' %}"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var html = document.documentElement;
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('luxe-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>

</html>
