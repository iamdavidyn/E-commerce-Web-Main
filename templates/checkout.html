<!DOCTYPE html>
{% load static %}
<html lang="en" class="bg-background">

<head>

  <!-- =========================================
       THEME — SET BEFORE PAGE PAINT
  ========================================== -->

  <script>
    (function () {

      try {

        var saved =
          localStorage.getItem("luxe-theme");

        var theme =
          saved ||
          (
            window.matchMedia &&
            window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches
              ? "dark"
              : "light"
          );

        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

      } catch (e) {}

    })();
  </script>


  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ff6b00"
  >

  <title>
    Checkout | LUXE
  </title>

  <meta
    name="description"
    content="Complete your purchase securely on LUXE."
  >


  <!-- =========================================
       FONTS
  ========================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================
       CSS
  ========================================== -->

  <link
    rel="stylesheet"
    href="{% static 'css/style.css' %}"
  >

</head>


<body data-page="checkout">


  <!-- =========================================
       THEME TOGGLE
  ========================================== -->

  <button
    type="button"
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode"
  >

    <svg
      class="icon-sun"
      viewBox="0 0 24 24"
    >
      <circle
        cx="12"
        cy="12"
        r="4"
      ></circle>

      <path
        d="M12 2v2
           M12 20v2
           M4.93 4.93l1.41 1.41
           M17.66 17.66l1.41 1.41
           M2 12h2
           M20 12h2
           M6.34 17.66l-1.41 1.41
           M19.07 4.93l-1.41 1.41"
      ></path>
    </svg>


    <svg
      class="icon-moon"
      viewBox="0 0 24 24"
    >
      <path
        d="M21 12.79A9 9 0 1 1 11.21 3
           7 7 0 0 0 21 12.79z"
      ></path>
    </svg>

  </button>


  <!-- =========================================
       HEADER
  ========================================== -->

  <div id="site-header"></div>


  <!-- =========================================
       MAIN
  ========================================== -->

  <main>


    <!-- =======================================
         PAGE HERO
    ======================================== -->

    <div class="page-hero">

      <div class="container">


        <nav
          class="breadcrumb"
          aria-label="Breadcrumb"
        >

          <a href="/">
            Home
          </a>

          <span>/</span>

          <a href="/cart/">
            Cart
          </a>

          <span>/</span>

          <span>
            Checkout
          </span>

        </nav>


        <h1>
          Checkout
        </h1>


      </div>

    </div>


    <!-- =======================================
         CHECKOUT ROOT
         checkout.js renders here
    ======================================== -->

    <div
      class="container"
      id="checkout-root"
    >

      <div class="empty-state">

        <p>
          Loading checkout...
        </p>

      </div>

    </div>


  </main>


  <!-- =========================================
       FOOTER
  ========================================== -->

  <div id="site-footer"></div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script
    src="{% static 'js/main.js' %}"
  ></script>


  <script
    src="{% static 'js/cart.js' %}"
  ></script>


  <script
    src="{% static 'js/checkout.js' %}"
  ></script>


  <!-- =========================================
       THEME TOGGLE
  ========================================== -->

  <script>

    (function () {

      var btn =
        document.getElementById(
          "theme-toggle"
        );


      if (!btn) {
        return;
      }


      btn.addEventListener(
        "click",
        function () {

          var html =
            document.documentElement;


          var current =
            html.getAttribute(
              "data-theme"
            );


          var next =
            current === "dark"
              ? "light"
              : "dark";


          html.setAttribute(
            "data-theme",
            next
          );


          try {

            localStorage.setItem(
              "luxe-theme",
              next
            );

          } catch (e) {}

        }
      );

    })();

  </script>


</body>

</html>
