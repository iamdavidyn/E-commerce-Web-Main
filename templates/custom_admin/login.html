{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | LUXE</title><link rel="stylesheet" href="{% static 'admin/css/bootstrap.min.css' %}"><link rel="stylesheet" href="{% static 'admin/css/luxe-admin.css' %}"></head>
<body style="min-height:100vh;display:grid;place-items:center"><div class="card-style" style="width:min(420px,92vw)"><div class="text-center mb-4"><div class="luxe-brand" style="background:#171715;border-radius:8px;padding:14px">LUXE</div><h3 class="mt-4">Admin sign in</h3><p class="text-muted small">Manage your store securely.</p></div><form onsubmit="event.preventDefault();location.href="{% url 'admin_dashboard' %}""><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="username" required placeholder="admin@example.com"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" required placeholder="••••••••"></div><div class="d-flex justify-content-between mb-3"><label class="small"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn btn-primary w-100">Sign in</button></form></div></body></html>
